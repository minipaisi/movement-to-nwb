[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eegmmidb-to-nwb"
version = "0.1.0"
description = "Convert the PhysioNet EEG Motor Movement/Imagery Dataset (EDF) to NWB with NeuroConv."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pablo Paisán García" }]
requires-python = ">=3.10"
dependencies = [
    "neuroconv[edf]>=0.10",
    "pynwb>=3.0",
    "mne>=1.6",
]

[project.optional-dependencies]
test = ["pytest", "nwbinspector>=0.6", "edfio"]

[project.scripts]
eegmmidb-to-nwb = "eegmmidb_to_nwb.cli:main"
eegmmidb-download = "eegmmidb_to_nwb.download:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eegmmidb_to_nwb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
